<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock C · Cartões (estilo RaceLab/iFL03)</title>
<link rel="stylesheet" href="mock.css">
<style>
  .hero{background:linear-gradient(135deg,rgba(255,140,38,.22),rgba(255,140,38,.04));
    border:1px solid rgba(255,140,38,.4)}
  .hero .big{font-size:26px;font-weight:800}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{text-align:left;padding:12px}
  .tile .ic{font-size:22px}
  .tile b{display:block;margin:2px 0}
  .tile small{color:var(--dim)}
  .tile .st{color:var(--ok);font-size:11.5px}
  .detail{display:none}
  .detail.show{display:grid}
</style>
</head>
<body>
<div class="phone">
  <nav class="switch">
    <a href="mock-a-console.html">A · Console</a>
    <a href="mock-b-wizard.html">B · Assistente</a>
    <a class="cur" href="mock-c-cards.html">C · Cartões</a>
  </nav>
  <div class="tag">Proposta C — home é um painel de cartões (RaceLab/iFL03); toque abre o detalhe</div>
  <div class="screen" id="home">
    <div class="card hero">
      <div class="mut small">AGORA · <span class="dot g"></span> AO VIVO — Spa · Corrida</div>
      <div class="big">P4 · V7 · 212 km/h</div>
      <div class="bar" style="margin-top:8px"><i style="width:50%"></i></div>
      <div class="mut small">⚖ avisos 2/4 · <span class="pips">●●○○</span></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="row">
      <button class="btn" style="flex:1">💾 Salvar</button>
      <button class="btn" style="flex:1">📊 Painel</button>
    </div>
  </div>
  <div class="screen detail" id="detail">
    <button class="btn ghost" id="back">‹ todos os cartões</button>
    <h1 id="dt"></h1>
    <div class="mut small" id="dd"></div>
    <div class="card" id="dbody"></div>
  </div>
  <div class="foot">toque num cartão p/ abrir · tudo com resumo de 1 linha</div>
</div>
<script>
const TILES = [
  ["preset","⚡","Preset","GT3 ativo","troca a corrida inteira num toque"],
  ["ia","🤖","Pilotos","briga 55","perfis, ultrapassagens, aprendizado"],
  ["race","🏁","Corrida","20v · 1 pit","combustível, pneus e largada"],
  ["safe","🟡","Segurança","2/4 avisos","bandeiras, cortes e box"],
  ["hud","📡","Tela & Voz","voz ligada","overlay, gravação e fala"],
  ["sys","⚙️","Ajustes","update!","visual, updates e ajuda"],
];
const grid = document.getElementById("grid");
TILES.forEach(([id,ic,t,st,d])=>{
  const b = document.createElement("button");
  b.className = "btn tile";
  b.innerHTML = `<span class="ic">${ic}</span><b>${t}</b><span class="st">${st}</span><br><small>${d}</small>`;
  b.onclick = ()=>open(id,ic,t,d);
  grid.appendChild(b);
});
function open(id,ic,t,d){
  document.getElementById("home").style.display = "none";
  document.getElementById("detail").classList.add("show");
  document.getElementById("dt").textContent = ic + " " + t;
  document.getElementById("dd").textContent = d;
  const bodies = {
    preset: `<div class="preset">
      <button class="btn acc">GT3<small>equilibrada</small></button><button class="btn">GT4<small>permissiva</small></button>
      <button class="btn">F1<small>rigorosa</small></button><button class="btn">Enduro<small>tolerante</small></button></div>`,
    safe: `<label>Advertências até punir <b class="v">4</b><input type="range" min="1" max="10" value="4"
      oninput="this.previousElementSibling.textContent=this.value"></label>
      <p class="mut small">Cortou demais = segundos parado no box, igual ao CMRT.</p>`,
  };
  document.getElementById("dbody").innerHTML = bodies[id] ||
    `<p class="mut">Aqui abririam os ajustes de <b>${t}</b>, cada um com resumo de 1 linha.</p>
     <label>Exemplo <b class="v">50</b><input type="range" min="0" max="100" value="50"
     oninput="this.previousElementSibling.textContent=this.value"></label>`;
}
document.getElementById("back").onclick = ()=>{
  document.getElementById("detail").classList.remove("show");
  document.getElementById("home").style.display = "";
};
</script>
</body>
</html>
