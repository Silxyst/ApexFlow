<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock A · Console (trilho + inspetor)</title>
<link rel="stylesheet" href="mock.css">
<style>
  .shell{display:grid;grid-template-columns:62px 1fr;min-height:560px}
  .rail{background:#070a11;border-right:1px solid var(--line);display:flex;flex-direction:column;
    align-items:center;gap:6px;padding:10px 0}
  .rail button{width:46px;height:46px;font-size:20px;border-radius:12px;position:relative}
  .rail button.cur{border-color:var(--acc);background:rgba(255,140,38,.16)}
  .rail button .bd{position:absolute;top:5px;right:7px;width:8px;height:8px;border-radius:50%;
    background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .insp{padding:14px;display:grid;gap:10px;align-content:start}
  .statusbar{grid-column:1/-1;border-top:1px solid var(--line);padding:8px 14px;color:var(--dim);font-size:12px}
  .cmd{display:flex;gap:8px;align-items:center}
  .cmd input{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:8px 10px}
</style>
</head>
<body>
<div class="phone">
  <nav class="switch">
    <a class="cur" href="mock-a-console.html">A · Console</a>
    <a href="mock-b-wizard.html">B · Assistente</a>
    <a href="mock-c-cards.html">C · Cartões</a>
  </nav>
  <div class="tag">Proposta A — paradigma atual (v0.17): trilho de ícones + inspetor + barra de status</div>
  <div class="shell">
    <div class="rail" id="rail"></div>
    <div class="insp">
      <div class="cmd">
        <button class="btn acc" style="padding:8px 10px">⏻</button>
        <input id="q" placeholder="⌨ filtrar…  ex: pit">
        <button class="btn" id="mode" title="Alternar modo">😊</button>
      </div>
      <div id="crumb" class="mut small">APEXFLOW › Segurança</div>
      <h1 id="title">Segurança</h1>
      <div class="mut small" id="desc">O que te pune e o que te protege.</div>
      <div id="views"></div>
    </div>
  </div>
  <div class="statusbar"><span class="dot g"></span> LIVE &nbsp; ⚖ 2/4 &nbsp; 💾 auto &nbsp; v0.17.0</div>
</div>
<script>
const VIEWS = {
  dash:[["Assistente","3 passos p/ começar",0],["Preset da corrida","GT3 ativo",0],["Saúde agora","2 avisos · pista verde",0]],
  ai:[["01 · Quanto o grid briga","0 calmo ↔ 100 agressivo · atual 55",0],["02 · Ritmo e dificuldade","100% = jogo original",0],["03 · Ultrapassagens","IA tenta passar de verdade",0],["04 · Multiclasse 🔧","protótipos + GT",1],["06 · Box e quebras","limite real + IA quebra",0]],
  race:[["01 · Combustível e pits","20v / 1 pit calculado",0],["02 · Largada em movimento 🔧","fila 2x2 · desligado",1]],
  safety:[["01 · Bandeiras","acidente → todo mundo reduz",0],["02 · Cortes de pista","avisos → box · igual CMRT",0]],
  hud:[["01 · Painel na tela","o que o overlay mostra",0],["02 · Gravação e voz","CSV + fala os avisos",0]],
  sys:[["01 · Visual","cor e transparência",0],["02 · Atualizações","nova versão disponível!",0],["04 · Ajuda","tudo explicado simples",0]],
};
const RAIL = [["dash","🏠"],["ai","🤖"],["race","🏁"],["safety","🟡"],["hud","📡"],["sys","⚙️"]];
const BADGE = {ai:1, race:1, safety:1, sys:1};
let cur = "safety", simple = true;
const rail = document.getElementById("rail");
RAIL.forEach(([id,icon])=>{
  const b = document.createElement("button");
  b.className = "btn" + (id===cur ? " acc" : "");
  b.innerHTML = icon + (BADGE[id] ? '<span class="bd"></span>' : '');
  b.title = id;
  b.onclick = ()=>{ cur = id; paint(); };
  rail.appendChild(b);
});
document.getElementById("mode").onclick = e => {
  simple = !simple; e.target.textContent = simple ? "😊" : "🛠️"; paint();
};
document.getElementById("q").oninput = e => paint(e.target.value.toLowerCase());
function paint(filter=""){
  document.querySelectorAll("#rail button").forEach((b,i)=>b.classList.toggle("acc", RAIL[i][0]===cur));
  document.getElementById("crumb").textContent = "APEXFLOW › " + cur;
  const box = document.getElementById("views"); box.innerHTML = "";
  VIEWS[cur].forEach(([t,d,adv])=>{
    if(simple && adv){
      box.innerHTML += `<button class="btn ghost" style="width:100%;text-align:left">🔧 ${t} <span class="mut">(avançado)</span></button>`;
      return;
    }
    if(filter && !(t+d).toLowerCase().includes(filter)) return;
    const det = document.createElement("details");
    det.open = cur==="safety" && t.startsWith("02");
    det.innerHTML = `<summary>› ${t}</summary><div class="in">${d}<br><br>
      <label>Ajuste demo <b class="v">50</b><input type="range" min="0" max="100" value="50"
      oninput="this.previousElementSibling.textContent=this.value"></label></div>`;
    box.appendChild(det);
  });
  if(!box.children.length) box.innerHTML = '<p class="mut">Nada bate com o filtro. <b>X</b> limpa.</p>';
}
paint();
</script>
</body>
</html>
