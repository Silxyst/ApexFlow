<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock B · Assistente primeiro</title>
<link rel="stylesheet" href="mock.css">
<style>
  .steps{display:flex;gap:6px;align-items:center}
  .steps i{flex:1;height:8px;border-radius:5px;background:var(--bg3)}
  .steps i.done{background:var(--ok)} .steps i.now{background:var(--acc);animation:bl 1.2s infinite}
  .bigbtn{width:100%;text-align:left;padding:13px}
  .bigbtn small{display:block;color:var(--dim);font-weight:400}
  .nav2{display:flex;gap:8px} .nav2 .btn{flex:1}
  .okline{color:var(--ok)}
</style>
</head>
<body>
<div class="phone">
  <nav class="switch">
    <a href="mock-a-console.html">A · Console</a>
    <a class="cur" href="mock-b-wizard.html">B · Assistente</a>
    <a href="mock-c-cards.html">C · Cartões</a>
  </nav>
  <div class="tag">Proposta B — o app É o assistente: 3 passos e some (modo zen depois)</div>
  <div class="screen">
    <div>
      <h1 id="t">1 · Que corrida é essa?</h1>
      <div class="mut small" id="d">Isso ajusta limites e bandeiras sozinho.</div>
    </div>
    <div class="steps"><i id="s1" class="now"></i><i id="s2"></i><i id="s3"></i></div>
    <div id="body" style="display:grid;gap:8px"></div>
    <div class="nav2">
      <button class="btn ghost" id="back">‹ Voltar</button>
      <button class="btn acc" id="next">Continuar ›</button>
    </div>
    <button class="btn ghost small" id="skip">usar modo manual (console)</button>
  </div>
  <div class="foot">passo <b id="n">1</b> de 3 · dá p/ mudar tudo depois</div>
</div>
<script>
let step = 1, preset = "gt3", fiscal = true, voz = true;
const PRE = [["gt3","GT3","equilibrada — comece aqui"],["gt4","GT4","base, permissiva"],
  ["f1","F1","rigorosa, pune rápido"],["endurance","Enduro","longas, tolerante"]];
function paint(){
  document.getElementById("n").textContent = step;
  ["s1","s2","s3"].forEach((id,i)=>{
    const el = document.getElementById(id);
    el.className = i+1 < step ? "done" : (i+1 === step ? "now" : "");
  });
  const b = document.getElementById("body"); b.innerHTML = "";
  document.getElementById("back").style.visibility = step === 1 ? "hidden" : "visible";
  if(step === 1){
    document.getElementById("t").textContent = "1 · Que corrida é essa?";
    document.getElementById("d").textContent = "Isso ajusta limites e bandeiras sozinho.";
    PRE.forEach(([k,l,d])=>{
      b.innerHTML += `<button class="btn bigbtn ${k===preset?'acc':''}" data-k="${k}">${l}<small>${d}</small></button>`;
    });
    b.querySelectorAll("button").forEach(x=>x.onclick=()=>{preset=x.dataset.k;paint();});
    document.getElementById("next").textContent = "Continuar ›";
  } else if(step === 2){
    document.getElementById("t").textContent = "2 · Ligar a fiscalização?";
    document.getElementById("d").textContent = "Sem isso o app só observa.";
    b.innerHTML = `
      <button class="btn bigbtn ${fiscal?'acc':''}" id="f">Fiscalizar cortes<small>avisa e pune igual ao CMRT</small></button>
      <button class="btn bigbtn ${voz?'acc':''}" id="v">Avisos por voz<small>fala sem precisar de CrewChief</small></button>`;
    b.querySelector("#f").onclick = ()=>{fiscal=!fiscal;paint();};
    b.querySelector("#v").onclick = ()=>{voz=!voz;paint();};
    document.getElementById("next").textContent = "Continuar ›";
  } else {
    document.getElementById("t").textContent = "3 · Pronto para largar";
    document.getElementById("d").textContent = "Resumo do que foi ligado.";
    b.innerHTML = `<div class="card">
      <div>🏁 Preset: <b>${preset.toUpperCase()}</b></div>
      <div>${fiscal?'<span class="okline">✅</span>':'○'} Fiscalização ${fiscal?'ligada':'desligada'}</div>
      <div>${voz?'<span class="okline">✅</span>':'○'} Voz ${voz?'ligada':'desligada'}</div>
      <div class="mut small" style="margin-top:6px">Entre em pista — o resto é automático.</div></div>`;
    document.getElementById("next").textContent = "🏁 Concluir";
  }
}
document.getElementById("back").onclick = ()=>{ if(step>1){step--;paint();} };
document.getElementById("next").onclick = ()=>{
  if(step<3){step++;paint();}
  else document.getElementById("body").innerHTML =
    '<div class="card" style="text-align:center;font-size:16px">🏁 <b>Boa corrida!</b><br><span class="mut small">o app some e só o painel de corrida fica</span></div>';
};
document.getElementById("skip").onclick = ()=>location.href="mock-a-console.html";
paint();
</script>
</body>
</html>
