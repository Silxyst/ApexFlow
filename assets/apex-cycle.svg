<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="ApexFlow race weekend: formation, green flag, live gaps, pits and penalty points"><title>From formation to chequered — the ApexFlow race weekend</title><defs><linearGradient id="axTrack" x1="0" y1="0" x2="1060" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff6a15"/><stop offset=".5" stop-color="#00d4ff"/><stop offset="1" stop-color="#22c55e"/></linearGradient><filter id="axSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter></defs><rect width="1200" height="250" rx="20" fill="#0d0f16"/><rect width="1200" height="250" rx="20" fill="none" stroke="#2a3a4c"/><circle cx="212" cy="30" r="5" fill="#ff6a15"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="228" y="35" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#9fb2c1">FROM FORMATION TO CHEQUERED — THE APEXFLOW WEEKEND</text><text x="1066" y="35" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#22c55e">LIVE</text><rect x="70" y="58" width="1060" height="6" rx="3" fill="#232c38"/><rect x="70" y="58" width="1060" height="6" rx="3" fill="url(#axTrack)" opacity=".35"/><circle cx="70" cy="61" r="7" fill="#ff6a15" filter="url(#axSoft)"><animateMotion path="M0 0 H1060" dur="8s" repeatCount="indefinite"/></circle><circle cx="70" cy="61" r="4" fill="#ffffff"><animateMotion path="M0 0 H1060" dur="8s" repeatCount="indefinite"/></circle><g font-family="Arial, Helvetica, sans-serif"><g opacity="1"><animate attributeName="opacity" values="1;.42;.42;.42;1" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/><rect x="70" y="90" width="248" height="118" rx="14" fill="#121826" stroke="#ff6a15" stroke-width="2"/><circle cx="96" cy="114" r="7" fill="#ff6a15"/><text x="112" y="119" font-size="13" font-weight="800" letter-spacing="1" fill="#EAF2F8">2x2 FORMATION</text><text x="96" y="146" font-size="12" fill="#8fa2b1">Aligned rolling start,</text><text x="96" y="164" font-size="12" fill="#8fa2b1">no first-lap chaos</text><text x="96" y="190" font-size="11" font-weight="700" fill="#ff6a15">1 • LIGHTS OUT</text></g><g opacity=".42"><animate attributeName="opacity" values=".42;1;.42;.42;.42" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/><rect x="342" y="90" width="248" height="118" rx="14" fill="#121826" stroke="#00d4ff" stroke-width="2"/><circle cx="368" cy="114" r="7" fill="#00d4ff"/><text x="384" y="119" font-size="13" font-weight="800" letter-spacing="1" fill="#EAF2F8">AI THINKS</text><text x="368" y="146" font-size="12" fill="#8fa2b1">Own line per driver,</text><text x="368" y="164" font-size="12" fill="#8fa2b1">attacks with a real gap</text><text x="368" y="190" font-size="11" font-weight="700" fill="#00d4ff">2 • RACE ON</text></g><g opacity=".42"><animate attributeName="opacity" values=".42;.42;1;.42;.42" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/><rect x="614" y="90" width="248" height="118" rx="14" fill="#121826" stroke="#8b5cf6" stroke-width="2"/><circle cx="640" cy="114" r="7" fill="#8b5cf6"/><text x="656" y="119" font-size="13" font-weight="800" letter-spacing="1" fill="#EAF2F8">LIVE GAPS</text><text x="640" y="146" font-size="12" fill="#8fa2b1">Meters + sector delta,</text><text x="640" y="164" font-size="12" fill="#8fa2b1">blue when lapped</text><text x="640" y="190" font-size="11" font-weight="700" fill="#8b5cf6">3 • EVENTS HUD</text></g><g opacity=".42"><animate attributeName="opacity" values=".42;.42;.42;1;.42" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/><rect x="886" y="90" width="248" height="118" rx="14" fill="#121826" stroke="#22c55e" stroke-width="2"/><circle cx="912" cy="114" r="7" fill="#22c55e"/><text x="928" y="119" font-size="13" font-weight="800" letter-spacing="1" fill="#EAF2F8">PITS + PP</text><text x="912" y="146" font-size="12" fill="#8fa2b1">Fuel strategy + stops,</text><text x="912" y="164" font-size="12" fill="#8fa2b1">penalties persist</text><text x="912" y="190" font-size="11" font-weight="700" fill="#22c55e">4 • CHEQUERED</text></g></g><text x="326" y="162" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#3b4c5e">›</text><text x="598" y="162" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#3b4c5e">›</text><text x="870" y="162" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#3b4c5e">›</text><text x="600" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64798a">Guarded module loading • per-track memory • zero errors in custom_shaders_patch.log</text></svg>